<!DOCTYPE html>
<html>
    {{ partial "head.html" . }}
    <body>
        {{ partial "header.html" . }}
        <div class="container pb-5 pt-2 pt-md-4">
            {{ block "main" . }}{{ end }}
        </div>
        {{ partial "footer.html" . }}
    </body>

    {{ if not hugo.IsServer }}
        {{ template "_internal/google_analytics.html" . }}
        {{ partial "goatcounter.html" . }}
    {{ end }}

    <script type="text/javascript" src="{{ "js/main.js" | absURL }}"></script>
</html>
