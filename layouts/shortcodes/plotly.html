<!-- source: https://metalblueberry.github.io/post/howto/2019-11-23_add_plots_with_hugo_shortcodes/ -->
{{ .Page.Store.Set "plotly" true }}
{{ if not (.Get 0) }}{{ errorf "plotly shortcode: missing plot name (first parameter) at %s" .Position }}{{ end }}
{{/* Keep the container empty: any text here would leak into .Summary, meta descriptions and the RSS feed. */}}
<div class="figure">
<div class="figure-plot" id="{{ .Get 0 }}"></div>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const plot = document.getElementById("{{ .Get 0 }}");
  const figure = {{ .Inner | safeJS }};

  if (!figure) {
    plot.innerText = "ERROR: figure is not defined";
    return;
  }
  Plotly.newPlot(plot, figure);
});
</script>
</div>
