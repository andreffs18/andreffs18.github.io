{{ define "main" }}
<div class="container about">
    <div class="row">
        <div class="col-md-4">
            <div class="profile-pics">
                {{ range resources.Match "images/about/*" }}
                {{ $img := .Resize "800x webp q100" }}
                <figure class="profile-pic">
                    <img src="{{ $img.RelPermalink }}" alt="{{ .Title }}" draggable="false">
                </figure>
                {{ end }}
            </div>
        </div>
        <div class="col-md-8">
            {{ .Content }}
        </div>
    </div>
</div>
<script>
(function () {
    var el = document.querySelector('.profile-pics');
    if (!el) return;

    function updateMask() {
        var atTop    = el.scrollTop <= 0;
        var atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
        var top    = atTop    ? 'black 0%'   : 'transparent 0%, black 8%';
        var bottom = atBottom ? 'black 100%' : 'black 88%, transparent 100%';
        var mask = 'linear-gradient(to bottom, ' + top + ', ' + bottom + ')';
        el.style.maskImage = mask;
        el.style.webkitMaskImage = mask;
    }

    el.addEventListener('scroll', updateMask);
    updateMask();

    var isDown = false, startY, scrollTop;
    el.addEventListener('mousedown', function (e) {
        isDown = true;
        el.classList.add('is-dragging');
        startY = e.pageY - el.getBoundingClientRect().top;
        scrollTop = el.scrollTop;
        e.preventDefault();
    });
    document.addEventListener('mouseup', function () {
        isDown = false;
        el.classList.remove('is-dragging');
    });
    el.addEventListener('mousemove', function (e) {
        if (!isDown) return;
        el.scrollTop = scrollTop - (e.pageY - el.getBoundingClientRect().top - startY);
    });
})();
</script>
{{ end }}
