<div class="container cv">
   {{ range hugo.Data.cv }}
   {{ $sectionName := .name }}
   <div class="section">
       {{ range $i, $s := .sections }}
       <div class="row">
           <div class="col-md-2">
               {{ if eq $i 0 }}<h3 class="text-uppercase">{{ $sectionName }}</h3>{{ end }}
           </div>
           <div class="col-md-4">
               <h4 class="text-left text-md-right"><a href="{{ $s.url }}" target="_blank">{{ $s.name }}</a></h4>
               <p class="cv-location text-left text-md-right">{{ $s.location }}</p>
               <h5 class="text-left text-md-right">{{ $s.timeframe }}</h5>
           </div>
           <div class="col-md-6 text-left description">
               {{ range $s.description }}
                   <p>{{ . | markdownify }}</p>
               {{ end }}
           </div>
       </div>
       {{ end }}
   </div>
   {{ end }}
   {{/* <div class="row mt-4">
       <div class="col-12 text-center">
           <a href="/cv.pdf" download data-goatcounter-click="download-cv" class="cv-download"><i class="fa fa-file-pdf-o"></i> Download CV</a>
       </div>
   </div> */}}
</div>
