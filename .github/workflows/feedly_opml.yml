name: Feedly OPML

on:
  schedule:
    - cron: "30 6 * * 1"  # weekly, Monday 06:30 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download OPML from Feedly
        env:
          FEEDLY_TOKEN: ${{ secrets.FEEDLY_TOKEN }}
        run: .github/scripts/feedly_opml.sh feedly.opml.tmp

      - name: Commit and push if the OPML changed
        run: |
          if cmp -s feedly.opml.tmp assets/feedly.opml; then
            echo "OPML unchanged, skipping commit"
          else
            diff -u assets/feedly.opml feedly.opml.tmp | head -n 60 || true
            mv feedly.opml.tmp assets/feedly.opml
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/feedly.opml
            git commit -m "📚 Update Feedly OPML export"
            git push
          fi
