title = "andreffs.com"
baseURL = "https://andreffs.com"
locale = "en-us"
publishDir = "docs"

enableGitInfo = true
enableRobotsTXT = true

ignorefiles = [
  # ie: "content/blog/_draft/.*"
]

[services]
  [services.googleAnalytics]
    ID = "G-KB0NHDJ4BY"
  [services.disqus]
    shortname = "andreffs"
  [services.rss]
    limit = 20

[markup]
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 1

  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = true
    noClasses = true
    style = "monokai"
    tabWidth = 4

[params]
    # Site HEAD's configs
    description = "Hey, I'm André Silva, a Portuguese Software Engineer living in Edinburgh, and this is my personal website."
    socialHandler = "andreffs18"

    # Tag cloud params
    enableTagCloud = true
    fontUnit = "em"
    largestFontSize = 2.5
    smallestFontSize = 1

    # Keep [params.author] last: in TOML every key after a sub-table header
    # belongs to that sub-table, so any scalar params must come before this.
    [params.author]
      name = "André Silva"
      email = "andreffs18@gmail.com"
